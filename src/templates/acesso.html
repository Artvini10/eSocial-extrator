<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso ao eSocial</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .card {
            background: #fff;
            padding: 30px;
            width: 420px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header img {
            max-width: 150px;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 24px;
            color: #1f2937;
            margin: 0;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            color: #1f2937;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="checkbox"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        small {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1e40af;
        }

        #erro {
            color: #dc2626;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <header>
            <img src="/static/logo.png" alt="SinergyRH">
            <h1>Extrator eSocial</h1>
        </header>

        <h2>Acesso ao eSocial</h2>

        <form onsubmit="return validarFormulario()" action="/acesso" method="post">
            <div class="field">
                <label>CNPJ Base</label>
                <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" required>
                <small>Informe o CNPJ base do empregador para consulta no eSocial.</small>
            </div>

            <div class="field">
                <label>Ambiente</label>
                <select name="ambiente" required>
                    <option value="">Selecione</option>
                    <option value="producao">Produção</option>
                    <option value="producao_restrita">Produção Restrita</option>
                </select>
                <small>Produção Restrita é ideal para testes.</small>
            </div>

            <div class="field">
                <label>Certificado</label>
                <select name="cert_tipo" required>
                    <option value="">Selecione</option>
                    <option value="A1">A1</option>
                    <option value="A3">A3</option>
                </select>
                <small>A1 (arquivo .pfx) ou A3 (token/cartão).</small>
            </div>

            <div class="field">
                <label>
                    <input type="checkbox" name="lgpd" value="1" required>
                    Aceito o tratamento de dados (LGPD)
                </label>
                <small>Finalidade: implantação e auditoria de base eSocial.</small>
            </div>

            <div class="field">
                <div id="erro"></div>
            </div>

            <button type="submit">Continuar</button>
        </form>
    </div>
</div>

<script>
function validarFormulario() {
    const cnpj = document.getElementById("cnpj").value;
    const erro = document.getElementById("erro");

    if (!validarCNPJ(cnpj)) {
        erro.innerText = "CNPJ inválido. Verifique o número informado.";
        return false;
    }

    erro.innerText = "";
    return true;
}

function validarCNPJ(cnpj) {
    cnpj = cnpj.replace(/[^\d]+/g,'');

    if (cnpj.length !== 14) return false;
    if (/^(\d)\1+$/.test(cnpj)) return false;

    let tamanho = cnpj.length - 2;
    let numeros = cnpj.substring(0, tamanho);
    let digitos = cnpj.substring(tamanho);
    let soma = 0;
    let pos = tamanho - 7;

    for (let i = tamanho; i >= 1; i--) {
        soma += numeros.charAt(tamanho - i) * pos--;
        if (pos < 2) pos = 9;
    }

    let resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
    if (resultado != digitos.charAt(0)) return false;

    tamanho++;
    numeros = cnpj.substring(0, tamanho);
    soma = 0;
    pos = tamanho - 7;

    for (let i = tamanho; i >= 1; i--) {
        soma += numeros.charAt(tamanho - i) * pos--;
        if (pos < 2) pos = 9;
    }

    resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
    return resultado == digitos.charAt(1);
}
</script>

</body>
</html>
