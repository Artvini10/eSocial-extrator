<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso ao eSocial</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .card {
            background: #fff;
            padding: 30px;
            width: 420px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header img {
            max-width: 150px;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 24px;
            color: #1f2937;
            margin: 0;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            color: #1f2937;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="checkbox"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        small {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1e40af;
        }

        #erro {
            color: #dc2626;
            font-size: 14px;
            min-height: 20px;
        }

        .status-cnpj {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 13px;
            min-height: 20px;
        }

        .status-cnpj.valido {
            color: #16a34a;
        }

        .status-cnpj.invalido {
            color: #dc2626;
        }

        .status-cnpj.pendente {
            color: #9333ea;
        }

        .status-icon {
            font-size: 16px;
        }

        #cnpj.valido {
            border-color: #16a34a;
            background-color: #f0fdf4;
        }

        #cnpj.invalido {
            border-color: #dc2626;
            background-color: #fef2f2;
        }

        #cnpj:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            opacity: 0.6;
        }

        button:disabled:hover {
            background: #9ca3af;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <header>
            <img src="/static/logo.png" alt="SinergyRH">
            <h1>Extrator eSocial</h1>
        </header>

        <h2>Acesso ao eSocial</h2>

        <form onsubmit="return validarFormulario()" action="/acesso" method="post">
            <div class="field">
                <label>CNPJ Base</label>
                <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" required maxlength="18">
                <small>Informe o CNPJ base do empregador para consulta no eSocial.</small>
                <div class="status-cnpj" id="statusCNPJ"></div>
            </div>

            <div class="field">
                <label>Ambiente</label>
                <select name="ambiente" required>
                    <option value="">Selecione</option>
                    <option value="producao">Produção</option>
                    <option value="producao_restrita">Produção Restrita</option>
                </select>
                <small>Produção Restrita é ideal para testes.</small>
            </div>

            <div class="field">
                <label>Certificado</label>
                <select name="certificado" required>
                    <option value="">Selecione</option>
                    <option value="A1">A1</option>
                    <option value="A3">A3</option>
                </select>
                <small>A1 (arquivo .pfx) ou A3 (token/cartão).</small>
            </div>

            <div class="field">
                <label>
                    <input type="checkbox" name="lgpd" value="1" required>
                    Aceito o tratamento de dados (LGPD)
                </label>
                <small>Finalidade: implantação e auditoria de base eSocial.</small>
            </div>

            <div class="field">
                <div id="erro"></div>
            </div>

            <button type="submit" id="btnSubmit" disabled>Continuar</button>
        </form>
    </div>
</div>

<script>
// CNPJ de teste para desenvolvimento
const CNPJ_TESTE = "11444777000161";

// Função para formatar CNPJ enquanto usuário digita
function formatarCNPJ(valor) {
    // Remove tudo que não é número
    let numeros = valor.replace(/\D/g, '');
    
    // Limita a 14 dígitos
    numeros = numeros.substring(0, 14);
    
    // Aplica a formatação XX.XXX.XXX/XXXX-XX
    if (numeros.length > 0) {
        if (numeros.length <= 2) {
            return numeros;
        } else if (numeros.length <= 5) {
            return numeros.substring(0, 2) + '.' + numeros.substring(2);
        } else if (numeros.length <= 8) {
            return numeros.substring(0, 2) + '.' + numeros.substring(2, 5) + '.' + numeros.substring(5);
        } else if (numeros.length <= 12) {
            return numeros.substring(0, 2) + '.' + numeros.substring(2, 5) + '.' + numeros.substring(5, 8) + '/' + numeros.substring(8);
        } else {
            return numeros.substring(0, 2) + '.' + numeros.substring(2, 5) + '.' + numeros.substring(5, 8) + '/' + numeros.substring(8, 12) + '-' + numeros.substring(12);
        }
    }
    return '';
}

// Função para validar CNPJ
function validarCNPJ(cnpj) {
    // Remove formatação
    const numeros = cnpj.replace(/\D/g, '');
    
    // Verifica se tem 14 dígitos
    if (numeros.length !== 14) return false;
    
    // Verifica se não é sequência repetida (ex: 11111111111111)
    if (/^(\d)\1+$/.test(numeros)) return false;
    
    // Valida primeiro dígito verificador
    let tamanho = numeros.length - 2;
    let numeros_base = numeros.substring(0, tamanho);
    let digitos = numeros.substring(tamanho);
    let soma = 0;
    let pos = tamanho - 7;

    for (let i = tamanho; i >= 1; i--) {
        soma += numeros_base.charAt(tamanho - i) * pos--;
        if (pos < 2) pos = 9;
    }

    let resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
    if (resultado != digitos.charAt(0)) return false;

    // Valida segundo dígito verificador
    tamanho++;
    numeros_base = numeros.substring(0, tamanho);
    soma = 0;
    pos = tamanho - 7;

    for (let i = tamanho; i >= 1; i--) {
        soma += numeros_base.charAt(tamanho - i) * pos--;
        if (pos < 2) pos = 9;
    }

    resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
    return resultado == digitos.charAt(1);
}

// Inicializar eventos do CNPJ no carregamento
document.addEventListener('DOMContentLoaded', function() {
    const inputCNPJ = document.getElementById('cnpj');
    const statusCNPJ = document.getElementById('statusCNPJ');
    const btnSubmit = document.getElementById('btnSubmit');
    
    // Event listener para input
    inputCNPJ.addEventListener('input', function(e) {
        let valor = e.target.value;
        let formatado = formatarCNPJ(valor);
        
        // Atualiza o valor do input com formatação
        if (formatado !== valor) {
            e.target.value = formatado;
        }
        
        // Valida e atualiza status
        atualizarStatusCNPJ(formatado, statusCNPJ, btnSubmit);
    });
    
    // Event listener para quando o campo perde foco
    inputCNPJ.addEventListener('blur', function(e) {
        const cnpj = e.target.value;
        // Se campo estiver vazio, limpa o status
        if (cnpj.length === 0) {
            statusCNPJ.innerHTML = '';
            btnSubmit.disabled = true;
            e.target.classList.remove('valido', 'invalido');
        }
    });
});

// Função para atualizar status visual do CNPJ
function atualizarStatusCNPJ(cnpj, statusElement, btnSubmit) {
    const numeros = cnpj.replace(/\D/g, '');
    
    if (numeros.length === 0) {
        statusElement.innerHTML = '';
        statusElement.classList.remove('valido', 'invalido', 'pendente');
        btnSubmit.disabled = true;
        document.getElementById('cnpj').classList.remove('valido', 'invalido');
        return;
    }
    
    if (numeros.length < 14) {
        statusElement.innerHTML = '<span class="status-icon">⏳</span> Digite todos os números...';
        statusElement.classList.remove('valido', 'invalido');
        statusElement.classList.add('pendente');
        btnSubmit.disabled = true;
        document.getElementById('cnpj').classList.remove('valido', 'invalido');
        return;
    }
    
    // Validar CNPJ (aceita CNPJ de teste ou CNPJs válidos reais)
    const ehValido = validarCNPJ(numeros) || numeros === CNPJ_TESTE;
    
    if (ehValido) {
        statusElement.innerHTML = '<span class="status-icon">✓</span> CNPJ válido';
        statusElement.classList.remove('invalido', 'pendente');
        statusElement.classList.add('valido');
        btnSubmit.disabled = false;
        document.getElementById('cnpj').classList.remove('invalido');
        document.getElementById('cnpj').classList.add('valido');
    } else {
        statusElement.innerHTML = '<span class="status-icon">✗</span> CNPJ inválido';
        statusElement.classList.remove('valido', 'pendente');
        statusElement.classList.add('invalido');
        btnSubmit.disabled = true;
        document.getElementById('cnpj').classList.remove('valido');
        document.getElementById('cnpj').classList.add('invalido');
    }
}

function validarFormulario() {
    const cnpj = document.getElementById("cnpj").value;
    const erro = document.getElementById("erro");
    const numeros = cnpj.replace(/\D/g, '');
    
    // Validação final no submit
    const ehValido = validarCNPJ(numeros) || numeros === CNPJ_TESTE;
    
    if (!ehValido) {
        erro.innerText = "CNPJ inválido. Verifique o número informado.";
        return false;
    }

    erro.innerText = "";
    return true;
}
</script>

</body>
</html>
